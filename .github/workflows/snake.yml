name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once every day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: sahelstha
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23EC4899&color_dots=%23161b22,%234c1d95,%237c3aed,%23c026d3,%23ec4899

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
